<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 164" role="img" aria-labelledby="boat-title">
  <title id="boat-title">Thuyền buồm đỏ trên Biển Đông — minh họa</title>
  <defs>
    <linearGradient id="boat-main-sail" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#8e3029"/>
      <stop offset=".42" stop-color="#ce4c32"/>
      <stop offset=".78" stop-color="#dc6940"/>
      <stop offset="1" stop-color="#ae3d2d"/>
    </linearGradient>
    <linearGradient id="boat-small-sail" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#b33a2b"/>
      <stop offset=".65" stop-color="#d9683d"/>
      <stop offset="1" stop-color="#923b2b"/>
    </linearGradient>
    <linearGradient id="boat-hull" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#89603d"/>
      <stop offset=".35" stop-color="#64432f"/>
      <stop offset=".72" stop-color="#3d3730"/>
      <stop offset="1" stop-color="#203f3b"/>
    </linearGradient>
    <linearGradient id="boat-deck" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d3ab70"/>
      <stop offset="1" stop-color="#8c6542"/>
    </linearGradient>
    <linearGradient id="boat-reflection" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#973d2c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#973d2c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="boat-sail-weave" width="5" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 2h5M2 0v7" fill="none" stroke="#f8cc91" stroke-width=".35" opacity=".13"/>
    </pattern>
    <path id="boat-tall-cloth" d="M86 32 100 15Q106 27 110 37L108 39Q115 48 117 57L115 59Q122 68 125 79L122 81Q129 93 132 104Q112 115 91 118Z"/>
    <path id="boat-short-cloth" d="m53 56-10 14 1 3-4 15 2 2-4 18 2 3-1 9 20-5Z"/>
  </defs>

  <!-- Wake and reflection are painted into the illustration, not a geometric ring. -->
  <path d="M39 146q31 12 76-1l-8 6-15 1 8 3-31 2-18-5Z" fill="url(#boat-reflection)"/>
  <ellipse cx="80" cy="147" rx="54" ry="4.2" fill="#164e4b" opacity=".2"/>
  <g fill="none" stroke-linecap="round">
    <path d="M15 147q-11 3 4 5m8 2q28 5 47 1m29-2q29-1 39-7" stroke="#b6d3bc" stroke-width=".9" opacity=".55"/>
    <path d="M32 159q27 3 45 0m13-1 23-1M8 142l13-2m120 2 10-2" stroke="#d8dfc2" stroke-width=".75" opacity=".35"/>
    <path d="M36 150q24 2 36 0m16 0 29-4" stroke="#e5e1bc" stroke-width=".8" opacity=".6"/>
  </g>

  <!-- Fine stays sit behind the broad, battened cloth. -->
  <g fill="none" stroke="#cfb37c" stroke-width=".65" opacity=".7">
    <path d="M86 17 25 134M87 18l57 109M53 52 24 133M54 56l36 78"/>
  </g>
  <g stroke-linecap="round">
    <path d="m86 15 5 123M53 53l5 85" fill="none" stroke="#654a31" stroke-width="3"/>
    <path d="m86.8 16 4.8 121M53.7 54l4.9 82" fill="none" stroke="#e3bf7f" stroke-width=".8"/>
    <path d="M86 18q-8-3-11 2l10 3" fill="#e8c78c" stroke="#8c603b" stroke-width=".45"/>
  </g>

  <g stroke="#8c3929" stroke-width=".7" stroke-linejoin="round">
    <use href="#boat-short-cloth" fill="url(#boat-small-sail)"/>
    <use href="#boat-tall-cloth" fill="url(#boat-main-sail)"/>
    <use href="#boat-short-cloth" fill="url(#boat-sail-weave)" stroke="none"/>
    <use href="#boat-tall-cloth" fill="url(#boat-sail-weave)" stroke="none"/>
  </g>
  <path d="M88 34q7 39 6 78l10-3q-2-42-6-86Z" fill="#f69758" opacity=".11"/>
  <g fill="none" stroke-linecap="round">
    <path d="m87 44 22-7M88 61l28-4M89 80l35-1M90 100l41 4M91 117l40-13M54 75l-10-3M55 90l-13-1M56 106l-16 4M57 115l-17 5" stroke="#f2b471" stroke-width=".85" opacity=".8"/>
    <path d="m87.5 46 22-7M88.5 63l28-4M89.5 82l34-1M90.5 102l40 4M54 77l-10-3M55 92l-13-1M56 108l-16 4" stroke="#8a3329" stroke-width=".65" opacity=".5"/>
    <path d="m100 16 8 21m1 3 7 17m0 3 8 19m-1 3 8 21" stroke="#f6bb77" stroke-width=".7" opacity=".7"/>
    <path d="M90 120l35 9M57 119l-24 15" stroke="#b9935c" stroke-width="1.2"/>
  </g>

  <!-- A low cabin, carved rails and warm plank seams keep the hull readable at map size. -->
  <g stroke="#5c4632" stroke-width=".7" stroke-linejoin="round">
    <path d="m66 127 5-7 16 1 5 8Z" fill="#614c36"/>
    <path d="m65 126 7-7 15 1 7 7Z" fill="url(#boat-deck)"/>
    <path d="M70 126h19v9H70Z" fill="#b08751"/>
    <path d="M73 128h4v4h-4Zm8 0h4v4h-4Z" fill="#253e35" stroke="none"/>
    <path d="M23 132q55 12 121-8l-6 7q-58 18-109 7Z" fill="url(#boat-deck)"/>
    <path d="M19 127q50 20 124-3l7-5q-7 17-23 25l-16-1q-30 13-63 3l-11 1q-11-7-18-20Z" fill="url(#boat-hull)" stroke="#233e35" stroke-width="1.1"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 127q51 22 124-3l7-5" stroke="#f0cf8e" stroke-width="1.8"/>
    <path d="M26 134q51 20 112-3" stroke="#bd925c" stroke-width="1.1"/>
    <path d="M34 140q43 17 96-2" stroke="#c59b65" stroke-width=".65" opacity=".8"/>
    <path d="m41 138 5 7m17-3 2 6m24-7-1 6m23-12-3 9" stroke="#1c3934" stroke-width=".9"/>
    <path d="M40 146q8-3 15 1t15 0 15 0 16-2 15-1 13-3" stroke="#d5dfbf" stroke-width="1.2"/>
    <path d="m26 130-2-9m4 3-8-3M132 125l3-8m-3 2 6-2" stroke="#8c6942" stroke-width="1.4"/>
    <path d="m28 132 23 4m9 1 34-1m9-1 28-7" stroke="#e9c38a" stroke-width=".6"/>
  </g>
</svg>
